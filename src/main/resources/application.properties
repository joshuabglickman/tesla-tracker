# Put your secrets in config/application.properties (git-ignored), not here.
# See config/application.properties.example.

server.port=8080
# Only reachable from this machine. The dashboard has no login, so keep it that way
# unless you put it behind something that does.
server.address=127.0.0.1
server.servlet.session.tracking-modes=cookie

spring.datasource.url=jdbc:h2:file:./data/tesla-tracking
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

tesla.client-id=
tesla.client-secret=
tesla.redirect-uri=http://localhost:8080/auth/callback
tesla.authorize-url=https://auth.tesla.com/oauth2/v3/authorize
tesla.token-url=https://fleet-auth.prd.vn.cloud.tesla.com/oauth2/v3/token
# North America / Asia-Pacific. Europe / Middle East / Africa: https://fleet-api.prd.eu.vn.cloud.tesla.com
tesla.fleet-api-base-url=https://fleet-api.prd.na.vn.cloud.tesla.com
tesla.scopes=openid offline_access vehicle_device_data vehicle_location
tesla.data-dir=./data
# How often to check the vehicle list. That call never wakes the car.
tesla.poll-interval=PT5M
# While the car is online but parked, read the odometer at most this often so the car can fall asleep.
tesla.parked-poll-interval=PT1H

# Street addresses for parked positions, from OpenStreetMap's free Nominatim service.
# Usage policy: https://operations.osmfoundation.org/policies/nominatim/ (light personal use is fine).
geocoding.enabled=true
geocoding.reverse-url=https://nominatim.openstreetmap.org/reverse
geocoding.user-agent=tesla-tracking/1.0 (personal mileage tracker)
